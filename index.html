<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Hub Pro - Fullstack Edition</title>
    <!-- Thư viện CDN chuẩn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
        
        :root { --primary: #6366f1; }
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, h4, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
        input, textarea, select, button { font-family: 'Inter', sans-serif !important; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .flashcard-inner { transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .flashcard-flipped { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { backface-visibility: hidden; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .flashcard-back { transform: rotateY(180deg); }
        
        .pro-card { background: white; border: 1px solid #f1f5f9; border-radius: 24px; transition: all 0.3s ease; }
        .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, query, updateDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myManualFirebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "your-id",
            appId: "your-app-id"
        };

        const initFirebase = async () => {
            try {
                const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                const firebaseConfig = configStr ? JSON.parse(configStr) : myManualFirebaseConfig;
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                window.FB = {
                    auth, db,
                    methods: { signInAnonymously, signInWithCustomToken, onAuthStateChanged, collection, doc, addDoc, deleteDoc, onSnapshot, query, updateDoc, getDoc, setDoc }
                };
                window.dispatchEvent(new Event('firebase-ready'));
            } catch (error) {
                window.dispatchEvent(new Event('firebase-ready'));
            }
        };
        initFirebase();
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const Badge = ({ children, variant = 'default' }) => {
            const styles = {
                default: 'bg-slate-100 text-slate-600',
                pro: 'gradient-bg text-white shadow-sm',
                success: 'bg-emerald-100 text-emerald-700',
                error: 'bg-rose-100 text-rose-700'
            };
            return <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${styles[variant]}`}>{children}</span>;
        };

        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState({ isPro: false, streak: 0, xp: 0 });
            const [activeTab, setActiveTab] = useState('home');
            const [isSidebarOpen, setSidebarOpen] = useState(true);
            
            const [vocabList, setVocabList] = useState([]);
            const [chatMessages, setChatMessages] = useState([{ role: 'bot', text: 'Chào bạn! Tôi là AI Tutor. Hôm nay bạn cần hỗ trợ gì?' }]);
            
            const [isTranslating, setIsTranslating] = useState(false);
            const [translationResult, setTranslationResult] = useState(null);
            const [sourceText, setSourceText] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            const [tutorInput, setTutorInput] = useState('');
            const [globalError, setGlobalError] = useState(null);

            const [isFlipped, setIsFlipped] = useState(false);
            const [currentCardIndex, setCurrentCardIndex] = useState(0);

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'english-pro-hub-v4';
            const SRS_INTERVALS = [0, 1, 3, 7, 14, 30];

            useEffect(() => {
                const handleReady = () => setIsReady(true);
                window.addEventListener('firebase-ready', handleReady);
                if (window.FB) setIsReady(true);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            useEffect(() => {
                if (isReady && typeof lucide !== 'undefined') lucide.createIcons();
            }, [activeTab, vocabList, isSidebarOpen, isFlipped, isReady, chatMessages, translationResult]);

            useEffect(() => {
                if (!isReady || !window.FB) return;
                const { auth, methods } = window.FB;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await methods.signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await methods.signInAnonymously(auth);
                        }
                    } catch (e) { console.error("Auth error:", e); }
                };
                initAuth();
                return methods.onAuthStateChanged(auth, u => setUser(u));
            }, [isReady]);

            useEffect(() => {
                if (!user || !isReady || !window.FB) return;
                const { db, methods } = window.FB;
                const profileRef = methods.doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'profile');
                const unsubProfile = methods.onSnapshot(profileRef, (doc) => {
                    if (doc.exists()) setProfile(doc.data());
                    else methods.setDoc(profileRef, { isPro: false, streak: 0, xp: 0, lastStudy: null });
                });
                const unsubV = methods.onSnapshot(methods.collection(db, 'artifacts', appId, 'users', user.uid, 'vocabulary'), s => {
                    setVocabList(s.docs.map(d => ({id: d.id, ...d.data()})));
                });
                return () => { unsubProfile(); unsubV(); };
            }, [user, isReady]);

            const updateXP = async (amount) => {
                if (!user || !window.FB) return;
                const { db, methods } = window.FB;
                const profileRef = methods.doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'profile');
                await methods.updateDoc(profileRef, { xp: (profile.xp || 0) + amount });
            };

            // --- HÀM GỌI AI QUA BACKEND (BẢO MẬT TUYỆT ĐỐI) ---
            const callGemini = async (prompt, systemInstruction) => {
                const response = await fetch("/api/gemini", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt, system: systemInstruction }),
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || "Lỗi máy chủ");
                }

                const data = await response.json();
                
                // Trình trích xuất nội dung an toàn từ cấu trúc của Gemini
                try {
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    return JSON.parse(text);
                } catch (e) {
                    // Fallback nếu text không phải là JSON
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || data;
                }
            };

            const translateText = async () => {
                if (!sourceText.trim()) return;
                setIsTranslating(true);
                setGlobalError(null);
                const system = `Expert English-Vietnamese linguist. Return JSON: { "translation": "", "ipa": "", "meaning_simple": "", "when_to_use": "", "common_mistakes": "", "usage_examples": [{"en": "", "vi": ""}] }`;
                try {
                    const result = await callGemini(sourceText, system);
                    setTranslationResult(result);
                    updateXP(5);
                } catch (e) { 
                    setGlobalError("Không thể kết nối AI. Vui lòng kiểm tra cấu hình Backend /api/gemini và ENV.");
                } finally { setIsTranslating(false); }
            };

            const sendMessageToTutor = async () => {
                if (!tutorInput.trim()) return;
                const userMsg = tutorInput;
                setTutorInput('');
                setChatMessages(prev => [...prev, { role: 'user', text: userMsg }]);
                try {
                    const system = `Friendly English Tutor. Help students with grammar and vocabulary. Return JSON: {"reply": "..."}`;
                    const result = await callGemini(userMsg, system);
                    setChatMessages(prev => [...prev, { role: 'bot', text: result.reply || result }]);
                    updateXP(10);
                } catch (e) {
                    setChatMessages(prev => [...prev, { role: 'bot', text: 'Lỗi: Backend API chưa được thiết lập trên Vercel.' }]);
                }
            };

            const handleSRS = async (rating) => {
                const card = filteredDueCards[currentCardIndex];
                if (!card || !user || !window.FB) return;
                const { db, methods } = window.FB;
                let newLevel = (card.srs_level || 0);
                if (rating === 1) newLevel = 0;
                else if (rating === 2) newLevel = Math.max(0, newLevel - 1);
                else if (rating === 3) newLevel += 1;
                else if (rating === 4) newLevel += 2;
                newLevel = Math.min(newLevel, SRS_INTERVALS.length - 1);
                const nextReview = Date.now() + (SRS_INTERVALS[newLevel] * 24 * 60 * 60 * 1000);
                await methods.updateDoc(methods.doc(db, 'artifacts', appId, 'users', user.uid, 'vocabulary', card.id), {
                    srs_level: newLevel,
                    next_review: nextReview
                });
                setIsFlipped(false);
                updateXP(15);
                if (currentCardIndex >= filteredDueCards.length - 1) setCurrentCardIndex(0);
            };

            const filteredDueCards = useMemo(() => vocabList.filter(v => !v.next_review || v.next_review <= Date.now()), [vocabList]);
            const searchedVocab = useMemo(() => vocabList.filter(v => v.word?.toLowerCase().includes(searchQuery.toLowerCase()) || v.meaning?.toLowerCase().includes(searchQuery.toLowerCase())), [vocabList, searchQuery]);

            if (!isReady) return <div className="h-screen bg-indigo-950 flex flex-col items-center justify-center text-white gap-4 font-black italic"><div className="w-12 h-12 border-4 border-white/20 border-t-white rounded-full animate-spin"></div><p>POWERING UP ENG.PRO</p></div>;

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden">
                    <aside className={`${isSidebarOpen ? 'w-72' : 'w-20'} bg-white border-r border-slate-200 transition-all duration-300 flex flex-col z-50`}>
                        <div className="p-8 flex items-center justify-between">
                            {isSidebarOpen && <h1 className="text-xl font-extrabold italic uppercase">Eng<span className="text-indigo-600">Hub</span></h1>}
                            <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="p-2 hover:bg-slate-100 rounded-xl text-slate-400"><i data-lucide={isSidebarOpen ? 'chevron-left' : 'menu'}></i></button>
                        </div>
                        <nav className="flex-1 px-4 space-y-1">
                            <SideNavItem icon="home" label="Dashboard" active={activeTab === 'home'} onClick={() => setActiveTab('home')} collapsed={!isSidebarOpen} />
                            <SideNavItem icon="layers" label="Review (SRS)" active={activeTab === 'flashcards'} onClick={() => setActiveTab('flashcards')} collapsed={!isSidebarOpen} count={filteredDueCards.length} />
                            <SideNavItem icon="languages" label="Dịch AI" active={activeTab === 'translate'} onClick={() => setActiveTab('translate')} collapsed={!isSidebarOpen} />
                            <SideNavItem icon="book-marked" label="Kho từ vựng" active={activeTab === 'vocab'} onClick={() => setActiveTab('vocab')} collapsed={!isSidebarOpen} />
                            <SideNavItem icon="message-square" label="AI Tutor" active={activeTab === 'tutor'} onClick={() => setActiveTab('tutor')} collapsed={!isSidebarOpen} />
                        </nav>
                        <div className="p-4">
                            <div className={`p-4 rounded-3xl ${profile.isPro ? 'gradient-bg text-white' : 'bg-slate-900 text-white'} flex items-center gap-4 shadow-xl`}>
                                <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold">U</div>
                                {isSidebarOpen && <div className="flex-1 min-w-0"><p className="text-[10px] opacity-60 font-bold">Level {Math.floor((profile.xp || 0) / 100)}</p><p className="text-xs font-bold truncate">User_{user?.uid?.slice(0, 4)}</p></div>}
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative overflow-hidden">
                        <header className="h-20 px-10 flex items-center justify-between border-b bg-white/50 backdrop-blur-xl sticky top-0 z-40">
                             <div className="flex items-center gap-6">
                                <h2 className="text-xl font-black text-slate-800 uppercase tracking-tighter">{activeTab}</h2>
                                <div className="flex items-center gap-2 bg-orange-50 px-3 py-1.5 rounded-xl border border-orange-100"><i data-lucide="flame" className="w-4 h-4 text-orange-500"></i><span className="font-black text-orange-700 text-sm">{profile.streak || 0}</span></div>
                                <div className="flex items-center gap-2 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-100"><i data-lucide="zap" className="w-4 h-4 text-indigo-500"></i><span className="font-black text-indigo-700 text-sm">{profile.xp || 0} XP</span></div>
                             </div>
                        </header>

                        <div className="flex-1 overflow-y-auto p-10 custom-scrollbar">
                            {activeTab === 'home' && (
                                <div className="max-w-6xl mx-auto space-y-8 fade-in">
                                    <div className="p-12 rounded-[3rem] gradient-bg text-white shadow-2xl relative overflow-hidden">
                                        <i data-lucide="target" className="absolute -bottom-10 -right-10 opacity-10 w-64 h-64 animate-float"></i>
                                        <h2 className="text-5xl font-black tracking-tight leading-none mb-4">Hôm nay bạn học gì?</h2>
                                        <p className="text-indigo-100 font-medium mb-8">Hệ thống SRS đang có {filteredDueCards.length} thẻ cần ôn tập.</p>
                                        <button onClick={() => setActiveTab('flashcards')} className="bg-white text-indigo-600 px-10 py-4 rounded-2xl font-bold shadow-xl hover:scale-105 transition-all uppercase text-xs">Review ngay</button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        <div className="pro-card p-8 border-l-8 border-indigo-600 bg-white"><h3 className="font-bold text-lg mb-2">Trạng thái SRS</h3><p className="text-sm text-slate-500 mb-4">Tính năng Spaced Repetition giúp bạn nhớ từ vựng lâu gấp 5 lần.</p><Badge variant="pro">Smart Mode Active</Badge></div>
                                        <div className="pro-card p-8 border-l-8 border-emerald-600 bg-white"><h3 className="font-bold text-lg mb-2">Daily Streak</h3><p className="text-sm text-slate-500 mb-4">Hãy học ít nhất một từ để không làm mất chuỗi {profile.streak} ngày nhé!</p></div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'flashcards' && (
                                <div className="max-w-xl mx-auto space-y-10 fade-in py-10">
                                    {filteredDueCards.length > 0 ? (
                                        <div className="space-y-10">
                                            <div className="relative h-[450px] perspective-1000" onClick={() => setIsFlipped(!isFlipped)}>
                                                <div className={`flashcard-inner h-full shadow-2xl rounded-[3rem] ${isFlipped ? 'flashcard-flipped' : ''}`}>
                                                    <div className="flashcard-front bg-white border-4 border-indigo-50 flex flex-col items-center justify-center p-12 text-center rounded-[3rem]"><h3 className="text-5xl font-black text-indigo-600 tracking-tighter uppercase">{filteredDueCards[currentCardIndex].word}</h3><p className="text-slate-300 font-mono mt-4 text-xl">{filteredDueCards[currentCardIndex].ipa || '/.../'}</p><p className="mt-auto text-[10px] font-black text-slate-200 uppercase tracking-widest animate-pulse">Chạm để lật</p></div>
                                                    <div className="flashcard-back gradient-bg text-white flex flex-col items-center justify-center p-12 text-center rounded-[3rem]"><h3 className="text-4xl font-bold mb-6">{filteredDueCards[currentCardIndex].meaning}</h3><p className="text-sm italic opacity-90">"{filteredDueCards[currentCardIndex].example || 'Chưa có ví dụ.'}"</p></div>
                                                </div>
                                            </div>
                                            {isFlipped && <div className="grid grid-cols-4 gap-2 fade-in"><SRSButton label="Again" time="1h" color="bg-rose-500" onClick={() => handleSRS(1)} /><SRSButton label="Hard" time="1d" color="bg-orange-500" onClick={() => handleSRS(2)} /><SRSButton label="Good" time="3d" color="bg-indigo-500" onClick={() => handleSRS(3)} /><SRSButton label="Easy" time="7d" color="bg-emerald-500" onClick={() => handleSRS(4)} /></div>}
                                        </div>
                                    ) : <div className="pro-card p-24 text-center text-slate-300 italic border-dashed border-2 flex flex-col items-center gap-4"><i data-lucide="check-circle" className="w-12 h-12 opacity-20"></i><p>Bạn đã hoàn thành bài học hôm nay!</p></div>}
                                </div>
                            )}

                            {activeTab === 'translate' && (
                                <div className="max-w-5xl mx-auto space-y-8 fade-in">
                                    {globalError && <div className="bg-rose-50 border border-rose-100 p-4 rounded-2xl flex items-center gap-3 text-rose-700 font-medium text-sm"><i data-lucide="alert-circle" className="w-5 h-5"></i>{globalError}</div>}
                                    <div className="pro-card overflow-hidden grid grid-cols-1 lg:grid-cols-2 shadow-2xl bg-white">
                                        <div className="p-10 border-r border-slate-100"><Badge>Input English</Badge><textarea value={sourceText} onChange={e => setSourceText(e.target.value)} placeholder="Nhập văn bản cần phân tích..." className="w-full h-80 bg-transparent text-xl font-medium mt-6 outline-none resize-none placeholder:text-slate-200" /><button onClick={translateText} disabled={isTranslating} className="w-full mt-6 gradient-bg text-white py-4 rounded-2xl font-black uppercase text-sm shadow-xl transition-all disabled:opacity-50">{isTranslating ? 'AI Scanning...' : 'Dịch & Phân Tích'}</button></div>
                                        <div className="p-10 bg-slate-50/50 overflow-y-auto h-[550px] custom-scrollbar">
                                            {translationResult ? (
                                                <div className="space-y-8">
                                                    <div className="space-y-1"><h4 className="text-3xl font-black text-indigo-700">{translationResult.translation}</h4><p className="font-mono text-slate-400 text-lg">{translationResult.ipa}</p></div>
                                                    <div className="bg-white p-6 rounded-[2rem] border border-indigo-50 shadow-sm space-y-3"><Badge variant="success">Bản chất</Badge><p className="text-sm font-medium text-slate-700 leading-relaxed">{translationResult.meaning_simple}</p></div>
                                                    <div className="space-y-4"><p className="text-sm font-medium text-slate-600 bg-white p-4 rounded-2xl border border-slate-100">💡 {translationResult.when_to_use}</p><p className="text-sm font-medium text-rose-600 bg-rose-50 p-4 rounded-2xl border border-rose-100">⚠️ {translationResult.common_mistakes}</p></div>
                                                </div>
                                            ) : <div className="h-full flex flex-col items-center justify-center opacity-20 italic">AI đang chờ dữ liệu của bạn...</div>}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'tutor' && (
                                <div className="max-w-4xl mx-auto h-[650px] flex flex-col pro-card overflow-hidden fade-in bg-white shadow-xl">
                                    <div className="gradient-bg p-6 text-white flex items-center gap-4"><div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center shadow-lg"><i data-lucide="bot"></i></div><div><h3 className="font-black uppercase tracking-tight">AI Language Tutor</h3><p className="text-[10px] font-bold opacity-70 uppercase tracking-widest">Always active</p></div></div>
                                    <div className="flex-1 p-8 overflow-y-auto bg-slate-50/50 space-y-6 custom-scrollbar">
                                        {chatMessages.map((m, i) => (
                                            <div key={i} className={`flex gap-4 ${m.role === 'user' ? 'flex-row-reverse' : ''}`}><div className={`p-4 rounded-2xl max-w-[70%] text-sm font-medium shadow-sm ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white text-slate-700 rounded-tl-none border border-slate-100'}`}>{m.text}</div></div>
                                        ))}
                                    </div>
                                    <div className="p-6 bg-white border-t flex gap-4"><input value={tutorInput} onChange={e => setTutorInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessageToTutor()} type="text" placeholder="Nhập câu hỏi..." className="flex-1 px-6 py-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-100 transition-all text-sm font-medium" /><button onClick={sendMessageToTutor} className="gradient-bg text-white p-4 rounded-2xl shadow-lg"><i data-lucide="send" className="w-5 h-5"></i></button></div>
                                </div>
                            )}

                            {activeTab === 'vocab' && (
                                <div className="max-w-6xl mx-auto space-y-8 fade-in">
                                    <div className="relative flex-1 max-w-md"><i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-300"></i><input value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Tìm kiếm từ..." className="w-full pl-12 pr-6 py-3 bg-white border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-100 transition-all text-sm shadow-sm" /></div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{searchedVocab.map(item => (<div key={item.id} className="pro-card p-6 bg-white hover:border-indigo-400 border-2 border-transparent transition-all"><h4 className="font-black text-2xl text-slate-800 tracking-tighter uppercase mb-2">{item.word}</h4><p className="text-sm font-bold text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 mb-4">{item.meaning}</p><div className="flex items-center justify-between"><Badge variant={item.srs_level > 3 ? 'success' : 'default'}>Level {item.srs_level || 0}</Badge><span className="text-[9px] font-black text-slate-300 uppercase tracking-widest">{item.date}</span></div></div>))}</div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const SRSButton = ({ label, time, color, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center p-3 rounded-2xl text-white active:scale-95 transition-all shadow-md ${color}`}><span className="font-black text-[10px] uppercase tracking-tighter">{label}</span><span className="text-[10px] font-bold opacity-80">{time}</span></button>
        );

        const SideNavItem = ({ icon, label, active, onClick, collapsed, count }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl transition-all relative ${active ? 'bg-indigo-50 text-indigo-600 shadow-sm' : 'text-slate-500 hover:bg-slate-50'}`}><i data-lucide={icon} className={`w-5 h-5 shrink-0 ${active ? 'text-indigo-600' : 'text-slate-400'}`}></i>{!collapsed && <span className="font-black text-[11px] uppercase tracking-wider flex-1 text-left">{label}</span>}{count > 0 && !collapsed && <span className="bg-rose-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold">{count}</span>}</button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
